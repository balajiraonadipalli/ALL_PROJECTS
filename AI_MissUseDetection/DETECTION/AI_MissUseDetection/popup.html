<!DOCTYPE html>
<html>
<head>
    <title>AI Misuse Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>AI Misuse Detector</h3>
    
    <div class="status">
        <span>Protection Status</span>
        <div class="status-indicator" id="statusIndicator"></div>
    </div>
    
    <button id="toggleProtection">Enable Protection</button>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-number" id="totalScans">0</span>
            <span class="stat-label">Total Scans</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="blockedCount">0</span>
            <span class="stat-label">Blocked</span>
        </div>
    </div>
    
    <button id="viewLogs">View Recent Activity</button>
    <div id="logs" style="display: none; max-height: 300px; overflow-y: auto;"></div>
    
    <script src="popup.js"></script>
</body>
</html>
