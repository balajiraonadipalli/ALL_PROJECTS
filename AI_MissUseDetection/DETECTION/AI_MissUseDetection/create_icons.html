<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
</head>
<body>
    <h2>AI Misuse Detector Icons</h2>
    <p>Right-click on each canvas and save as PNG with the appropriate filename.</p>
    
    <h3>16x16 Icon</h3>
    <canvas id="icon16" width="16" height="16"></canvas>
    
    <h3>48x48 Icon</h3>
    <canvas id="icon48" width="48" height="48"></canvas>
    
    <h3>128x128 Icon</h3>
    <canvas id="icon128" width="128" height="128"></canvas>
    
    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Shield shape
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.moveTo(size * 0.5, size * 0.2);
            ctx.lineTo(size * 0.8, size * 0.3);
            ctx.lineTo(size * 0.8, size * 0.6);
            ctx.quadraticCurveTo(size * 0.8, size * 0.8, size * 0.5, size * 0.9);
            ctx.quadraticCurveTo(size * 0.2, size * 0.8, size * 0.2, size * 0.6);
            ctx.lineTo(size * 0.2, size * 0.3);
            ctx.closePath();
            ctx.fill();
            
            // AI text
            ctx.fillStyle = '#667eea';
            ctx.font = `bold ${size * 0.25}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('AI', size * 0.5, size * 0.6);
            
            // Warning symbol
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(size * 0.5, size * 0.75, size * 0.08, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.12}px Arial`;
            ctx.fillText('!', size * 0.5, size * 0.8);
        }
        
        // Generate all icons
        drawIcon('icon16', 16);
        drawIcon('icon48', 48);
        drawIcon('icon128', 128);
    </script>
</body>
</html>
